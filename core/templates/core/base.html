<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Africa Impact Platform{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        nav {
            background: #ffffff;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        nav a {
            text-decoration: none;
            color: #1f2937;
            font-weight: bold;
        }

        .logo {
            font-size: 22px;
        }

        .container {
            width: 84%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .hero {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 12px;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.7;
            max-width: 700px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .card h3 {
            margin-bottom: 12px;
        }

        .card p {
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 60px;
            color: #6b7280;
        }

        input,
textarea,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
    background: #ffffff;
}

input:focus,
textarea:focus,
select:focus {
    outline: none;
    border-color: #111827;
}
    </style>
</head>

<body>

<nav>

    <a href="/" class="logo">
        🌍 Africa Impact Platform
    </a>

    <div>
            <a href="/projects/" style="margin-right: 20px;">
        Projects
    </a>

    <a href="/projects/submit/" style="margin-right: 20px;">
        Submit Project
    </a>

    <a href="/analytics/">
        Impact Intelligence
    </a>


    </div>

</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

<footer>
    Africa Impact Platform — Connecting ideas with measurable impact.
</footer>

</body>
</html>
